[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-continuum-translational"
version = "0.1.0"
description = "Evidence-linked translational extensions for spatial-continuum-oncology."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "spatial-continuum @ git+https://github.com/Lukecele/spatial-continuum-oncology.git@main"
]

[project.optional-dependencies]
test = ["pytest"]
analysis = [
  "lifelines",
  "pandas",
  "h5py",
  "pyarrow",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
