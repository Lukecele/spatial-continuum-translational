name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original package
        run: python -m pip install git+https://github.com/Lukecele/spatial-continuum-oncology.git
      - name: Install extension
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m pytest -q
